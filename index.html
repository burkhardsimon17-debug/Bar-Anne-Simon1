<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anne & Simon</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: "Garamond", "Georgia", serif;
  background: #0b0b0f;
  color: #e0e0e0;
}

header {
  text-align: center;
  padding: 60px 20px 40px;
  border-bottom: 1px solid #2a2a2f;
  animation: fadeIn 0.8s ease-out;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(-20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

h1 {
  font-weight: 300;
  letter-spacing: 3px;
  font-size: 32px;
  margin-bottom: 10px;
  color: #ffffff;
}

.subtitle {
  font-size: 12px;
  letter-spacing: 2px;
  opacity: 0.5;
  text-transform: uppercase;
}

.filters {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
  padding: 30px 20px;
  border-bottom: 1px solid #2a2a2f;
  animation: slideDown 0.6s ease-out 0.2s both;
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

button {
  background: transparent;
  color: #b8b8b8;
  border: none;
  padding: 8px 0;
  font-family: "Garamond", "Georgia", serif;
  font-size: 13px;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  text-transform: uppercase;
  font-weight: 300;
  position: relative;
  overflow: hidden;
}

button::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 0;
  height: 1px;
  background: #d4af37;
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

button:hover {
  color: #d4af37;
}

button:hover::after {
  width: 100%;
}

button.active {
  color: #d4af37;
}

button.active::after {
  width: 100%;
}

.container {
  max-width: 700px;
  margin: 0 auto;
  padding: 40px 20px;
}

.category-section {
  margin-bottom: 50px;
  animation: fadeInUp 0.6s ease-out forwards;
  opacity: 0;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.category-section:nth-child(1) { animation-delay: 0s; }
.category-section:nth-child(2) { animation-delay: 0.1s; }
.category-section:nth-child(3) { animation-delay: 0.2s; }
.category-section:nth-child(4) { animation-delay: 0.3s; }
.category-section:nth-child(5) { animation-delay: 0.4s; }
.category-section:nth-child(n+6) { animation-delay: 0.5s; }

.category-title {
  font-size: 14px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #d4af37;
  margin-bottom: 25px;
  padding-bottom: 10px;
  border-bottom: 1px solid #2a2a2f;
  transition: color 0.3s ease;
}

.item {
  margin-bottom: 20px;
  padding-bottom: 20px;
  padding-left: 15px;
  border-bottom: 1px solid #1a1a1f;
  border-left: 2px solid transparent;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.item:hover {
  border-left-color: #d4af37;
  padding-left: 18px;
}

.item:last-child {
  border-bottom: none;
  margin-bottom: 0;
  padding-bottom: 0;
}

.item-name {
  font-size: 14px;
  color: #ffffff;
  margin-bottom: 2px;
  font-weight: 400;
  transition: color 0.3s ease;
}

.item:hover .item-name {
  color: #d4af37;
}

.item-status {
  font-size: 11px;
  letter-spacing: 1px;
  color: #999;
  transition: all 0.3s ease;
}

.item-status.available {
  color: #7fb069;
}

.item-status.unavailable {
  color: #b85c5c;
}

.loading {
  text-align: center;
  padding: 60px 20px;
  opacity: 0.5;
  font-size: 13px;
  letter-spacing: 1px;
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% {
    opacity: 0.5;
  }
  50% {
    opacity: 0.7;
  }
}

.error {
  text-align: center;
  padding: 60px 20px;
  color: #b85c5c;
  font-size: 13px;
  animation: shake 0.5s ease-out;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

.empty-message {
  text-align: center;
  padding: 40px 20px;
  opacity: 0.5;
  font-size: 13px;
  animation: fadeIn 0.4s ease-out;
}
</style>
</head>

<body>

<header>
  <h1>ANNE & SIMON</h1>
  <div class="subtitle">Carte des boissons</div>
</header>

<div class="filters" id="filters">
  <!-- Les boutons de filtrage seront générés dynamiquement ici -->
</div>

<div class="container" id="menu">
  <div class="loading">Chargement du menu...</div>
</div>

<script>

const SHEET_ID = "14WJ0G3f5frHAuu_1nt84rzOG8_ElEVEPudZHZgd0Dnw";
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

let dataGlobal = [];
let allCategories = [];
let currentFilter = 'all';

fetch(SHEET_URL)
.then(r => {
  if (!r.ok) throw new Error(`HTTP error! status: ${r.status}`);
  return r.text();
})
.then(data => {
  console.log("CSV chargé avec succès");
  const rows = data.split("\n").filter(row => row.trim() !== "");
  
  const startIdx = rows[0].toLowerCase().includes("nom") ? 1 : 0;

  rows.slice(startIdx).forEach((r, idx) => {
    try {
      const parts = r.split(",").map(p => p.trim());
      
      if(parts.length < 3) {
        console.warn(`Ligne ${idx} ignorée: pas assez de colonnes`);
        return;
      }

      const nom = parts[0];
      const cat = parts[1];
      const stock = parseInt(parts[2]) || 0;

      if(nom && cat) {
        dataGlobal.push({nom, cat, stock, available: stock > 0});
        
        // Extraire les catégories uniques dynamiquement
        if(!allCategories.includes(cat)) {
          allCategories.push(cat);
        }
      }
    } catch(e) {
      console.warn(`Erreur parsing ligne ${idx}:`, e);
    }
  });

  console.log(`${dataGlobal.length} boissons chargées`);
  console.log(`Catégories détectées:`, allCategories);
  
  // Générer les boutons de filtrage dynamiquement
  generateFilters();
  
  render(dataGlobal);
})
.catch(err => {
  console.error("Erreur de chargement CSV:", err);
  const menu = document.getElementById("menu");
  menu.innerHTML = `<div class="error">
    ❌ Erreur: Impossible de charger le menu
  </div>`;
});

function generateFilters() {
  const filtersDiv = document.getElementById("filters");
  filtersDiv.innerHTML = "";
  
  // Ajouter le bouton "Tous"
  const allBtn = document.createElement('button');
  allBtn.textContent = "Tous";
  allBtn.className = "active";
  allBtn.onclick = () => filter('all');
  filtersDiv.appendChild(allBtn);
  
  // Ajouter un bouton pour chaque catégorie détectée
  allCategories.forEach(cat => {
    const btn = document.createElement('button');
    btn.textContent = cat;
    btn.onclick = () => filter(cat);
    filtersDiv.appendChild(btn);
  });
}

function render(data){
  const menu = document.getElementById("menu");
  menu.innerHTML = "";

  if(data.length === 0) {
    menu.innerHTML = '<div class="empty-message">Aucun produit disponible</div>';
    return;
  }

  // Grouper par catégorie en respectant l'ordre des catégories détectées
  const grouped = {};
  allCategories.forEach(cat => {
    grouped[cat] = [];
  });
  
  data.forEach(item => {
    if(grouped[item.cat]) {
      grouped[item.cat].push(item);
    }
  });

  // Trier chaque catégorie alphabétiquement
  allCategories.forEach(cat => {
    grouped[cat].sort((a, b) => a.nom.localeCompare(b.nom));
  });

  // Afficher par catégorie
  allCategories.forEach(cat => {
    if(grouped[cat].length > 0) {
      const section = document.createElement('div');
      section.className = 'category-section';
      
      const title = document.createElement('div');
      title.className = 'category-title';
      title.textContent = cat;
      section.appendChild(title);

      grouped[cat].forEach(item => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'item';
        
        const name = document.createElement('div');
        name.className = 'item-name';
        name.textContent = item.nom;
        itemDiv.appendChild(name);

        const status = document.createElement('div');
        status.className = `item-status ${item.available ? 'available' : 'unavailable'}`;
        status.textContent = item.available ? '✓ Disponible' : '✕ Rupture';
        itemDiv.appendChild(status);

        section.appendChild(itemDiv);
      });

      menu.appendChild(section);
    }
  });
}

function filter(cat){
  currentFilter = cat;
  
  // Update button states
  document.querySelectorAll('button').forEach(btn => {
    btn.classList.remove('active');
  });
  event.target.classList.add('active');

  const menu = document.getElementById("menu");
  menu.innerHTML = "";

  let filteredData = dataGlobal;
  if(cat !== "all"){
    filteredData = dataGlobal.filter(d => d.cat === cat);
  }

  if(filteredData.length === 0) {
    menu.innerHTML = '<div class="empty-message">Aucun produit dans cette catégorie</div>';
    return;
  }

  // Grouper par catégorie
  const grouped = {};
  filteredData.forEach(item => {
    if(!grouped[item.cat]) {
      grouped[item.cat] = [];
    }
    grouped[item.cat].push(item);
  });

  // Trier chaque catégorie alphabétiquement
  Object.keys(grouped).forEach(c => {
    grouped[c].sort((a, b) => a.nom.localeCompare(b.nom));
  });

  // Afficher par catégorie
  Object.keys(grouped).forEach(c => {
    const section = document.createElement('div');
    section.className = 'category-section';
    
    const title = document.createElement('div');
    title.className = 'category-title';
    title.textContent = c;
    section.appendChild(title);

    grouped[c].forEach(item => {
      const itemDiv = document.createElement('div');
      itemDiv.className = 'item';
      
      const name = document.createElement('div');
      name.className = 'item-name';
      name.textContent = item.nom;
      itemDiv.appendChild(name);

      const status = document.createElement('div');
      status.className = `item-status ${item.available ? 'available' : 'unavailable'}`;
      status.textContent = item.available ? '✓ Disponible' : '✕ Rupture';
      itemDiv.appendChild(status);

      section.appendChild(itemDiv);
    });

    menu.appendChild(section);
  });
}

</script>

</body>
</html>

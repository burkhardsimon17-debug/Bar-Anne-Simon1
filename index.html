<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anne & Simon</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: "Garamond", "Georgia", serif;
  background: #0b0b0f;
  color: #e0e0e0;
}

header {
  text-align: center;
  padding: 60px 20px 40px;
  border-bottom: 1px solid #2a2a2f;
}

h1 {
  font-weight: 300;
  letter-spacing: 3px;
  font-size: 32px;
  margin-bottom: 10px;
  color: #ffffff;
}

.subtitle {
  font-size: 12px;
  letter-spacing: 2px;
  opacity: 0.5;
  text-transform: uppercase;
}

.filters {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 20px;
  padding: 30px 20px;
  border-bottom: 1px solid #2a2a2f;
}

button {
  background: transparent;
  color: #b8b8b8;
  border: none;
  padding: 0;
  font-family: "Garamond", "Georgia", serif;
  font-size: 13px;
  letter-spacing: 1px;
  cursor: pointer;
  transition: color 0.3s ease;
  text-transform: uppercase;
  font-weight: 300;
}

button:hover {
  color: #d4af37;
}

button.active {
  color: #d4af37;
  border-bottom: 1px solid #d4af37;
  padding-bottom: 5px;
}

.container {
  max-width: 700px;
  margin: 0 auto;
  padding: 40px 20px;
}

.category-section {
  margin-bottom: 50px;
}

.category-title {
  font-size: 14px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #d4af37;
  margin-bottom: 25px;
  padding-bottom: 10px;
  border-bottom: 1px solid #2a2a2f;
}

.item {
  margin-bottom: 20px;
  padding-bottom: 20px;
  border-bottom: 1px solid #1a1a1f;
}

.item:last-child {
  border-bottom: none;
  margin-bottom: 0;
  padding-bottom: 0;
}

.item-name {
  font-size: 14px;
  color: #ffffff;
  margin-bottom: 2px;
  font-weight: 400;
}

.item-status {
  font-size: 11px;
  letter-spacing: 1px;
  color: #999;
}

.item-status.available {
  color: #7fb069;
}

.item-status.unavailable {
  color: #b85c5c;
}

.loading {
  text-align: center;
  padding: 60px 20px;
  opacity: 0.5;
  font-size: 13px;
  letter-spacing: 1px;
}

.error {
  text-align: center;
  padding: 60px 20px;
  color: #b85c5c;
  font-size: 13px;
}

.empty-message {
  text-align: center;
  padding: 40px 20px;
  opacity: 0.5;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <h1>ANNE & SIMON</h1>
  <div class="subtitle">Carte des Spiritueux</div>
</header>

<div class="filters">
  <button onclick="filter('all')" class="active">Tous</button>
  <button onclick="filter('Cocktails')">Cocktails</button>
  <button onclick="filter('Vins')">Vins</button>
  <button onclick="filter('Spiritueux')">Spiritueux</button>
  <button onclick="filter('Bières')">Bières</button>
  <button onclick="filter('Sans alcool')">Sans alcool</button>
  <button onclick="filter('After dinner')">After dinner</button>
</div>

<div class="container" id="menu">
  <div class="loading">Chargement du menu...</div>
</div>

<script>

const SHEET_ID = "14WJ0G3f5frHAuu_1nt84rzOG8_ElEVEPudZHZgd0Dnw";
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv`;

let dataGlobal = [];
let currentFilter = 'all';

fetch(SHEET_URL)
.then(r => {
  if (!r.ok) throw new Error(`HTTP error! status: ${r.status}`);
  return r.text();
})
.then(data => {
  console.log("CSV chargé avec succès");
  const rows = data.split("\n").filter(row => row.trim() !== "");
  
  const startIdx = rows[0].toLowerCase().includes("nom") ? 1 : 0;

  rows.slice(startIdx).forEach((r, idx) => {
    try {
      const parts = r.split(",").map(p => p.trim());
      
      if(parts.length < 3) {
        console.warn(`Ligne ${idx} ignorée: pas assez de colonnes`);
        return;
      }

      const nom = parts[0];
      const cat = parts[1];
      const stock = parseInt(parts[2]) || 0;

      if(nom && cat) {
        dataGlobal.push({nom, cat, stock, available: stock > 0});
      }
    } catch(e) {
      console.warn(`Erreur parsing ligne ${idx}:`, e);
    }
  });

  console.log(`${dataGlobal.length} boissons chargées`);
  render(dataGlobal);
})
.catch(err => {
  console.error("Erreur de chargement CSV:", err);
  const menu = document.getElementById("menu");
  menu.innerHTML = `<div class="error">
    ❌ Erreur: Impossible de charger le menu
  </div>`;
});

function render(data){
  const menu = document.getElementById("menu");
  menu.innerHTML = "";

  if(data.length === 0) {
    menu.innerHTML = '<div class="empty-message">Aucun produit disponible</div>';
    return;
  }

  // Grouper par catégorie
  const grouped = {};
  data.forEach(item => {
    if(!grouped[item.cat]) {
      grouped[item.cat] = [];
    }
    grouped[item.cat].push(item);
  });

  // Afficher par catégorie
  Object.keys(grouped).forEach(cat => {
    const section = document.createElement('div');
    section.className = 'category-section';
    
    const title = document.createElement('div');
    title.className = 'category-title';
    title.textContent = cat;
    section.appendChild(title);

    grouped[cat].forEach(item => {
      const itemDiv = document.createElement('div');
      itemDiv.className = 'item';
      
      const name = document.createElement('div');
      name.className = 'item-name';
      name.textContent = item.nom;
      itemDiv.appendChild(name);

      const status = document.createElement('div');
      status.className = `item-status ${item.available ? 'available' : 'unavailable'}`;
      status.textContent = item.available ? '✓ Disponible' : '✕ Rupture';
      itemDiv.appendChild(status);

      section.appendChild(itemDiv);
    });

    menu.appendChild(section);
  });
}

function filter(cat){
  currentFilter = cat;
  
  // Update button states
  document.querySelectorAll('button').forEach(btn => {
    btn.classList.remove('active');
  });
  event.target.classList.add('active');

  const menu = document.getElementById("menu");
  menu.innerHTML = "";

  let filteredData = dataGlobal;
  if(cat !== "all"){
    filteredData = dataGlobal.filter(d => d.cat === cat);
  }

  if(filteredData.length === 0) {
    menu.innerHTML = '<div class="empty-message">Aucun produit dans cette catégorie</div>';
    return;
  }

  // Grouper par catégorie
  const grouped = {};
  filteredData.forEach(item => {
    if(!grouped[item.cat]) {
      grouped[item.cat] = [];
    }
    grouped[item.cat].push(item);
  });

  // Afficher par catégorie
  Object.keys(grouped).forEach(c => {
    const section = document.createElement('div');
    section.className = 'category-section';
    
    const title = document.createElement('div');
    title.className = 'category-title';
    title.textContent = c;
    section.appendChild(title);

    grouped[c].forEach(item => {
      const itemDiv = document.createElement('div');
      itemDiv.className = 'item';
      
      const name = document.createElement('div');
      name.className = 'item-name';
      name.textContent = item.nom;
      itemDiv.appendChild(name);

      const status = document.createElement('div');
      status.className = `item-status ${item.available ? 'available' : 'unavailable'}`;
      status.textContent = item.available ? '✓ Disponible' : '✕ Rupture';
      itemDiv.appendChild(status);

      section.appendChild(itemDiv);
    });

    menu.appendChild(section);
  });
}

</script>

</body>
</html>
